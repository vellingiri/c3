# Source of truth for VMs. Each key is a STABLE name: it is the Terraform
# for_each key, the hostname and the DNS name. Adding/removing/reordering
# entries never touches the other VMs.
#
# defaults:  applied to every node; any node can override a field.
# vars:      free-form values rendered into the cloud-init templates.

environment: prod   # tag/metadata on every resource. Since 2026-10-22 the environment is also part of the VM NAME (<role><n>-<env>), like cka and qa

defaults:
  image: ubuntu2404
  keypair: default-key
  # IDs taken from v1 nodes/compute/compute.tf
  security_group_ids:
    - f00e0d86-c4f7-492d-893d-dab70cf732be  # default
    - 80068ced-6e70-4977-aa86-3ae9b40d3c4e  # k8s
  domain: rdulinux.com     # prod uses plain role names (controller1, worker1, db1, runner, s3, rancher); cka and qa carry the environment (c1-cka, w1-qa)
  vars:
    dns_server: 192.168.2.2
    nfs_server: repo.rdulinux.com
    k8s_version: v1.30
    calico_version: v3.28.0
    pod_cidr: 10.244.0.0/16    # was 192.168.0.0/16, which overlapped the 192.168.2.x floating network (pods could not reach floating IPs); changed 2026-11-19 with the cluster rebuild
    cluster_name: prod
    join_delay: "0"      # seconds a control-plane join waits (stagger nodes that are created together)
    api_endpoint: "api.prod.rdulinux.com"   # name of the cluster's API load balancer once it is HA (api.prod.rdulinux.com); empty = the first controller's floating IP

nodes:
  # Migrated from v1 (adopted in place with scripts/adopt-node.sh):
  # Shared services stay in the main zone: apps use db.rdulinux.com.
  # db1 was "db". The name db.rdulinux.com is now a service alias for the current primary (see infra/infra.yaml).
  db1: { role: database, member: db1, ip: 10.0.1.191, flavor: m1.small-2g-20g, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }  # default SG only
  # db1 and db2 run PostgreSQL under Patroni (docs/db-ha-patroni.md); a rebuilt one sets itself up from cloud-init and joins the running pair.
  # `ip` is required for database and witness nodes (the group is built from these addresses; same value the VM already has).
  db2: { role: database, member: db2, ip: 10.0.1.69, flavor: m1.small-2g-20g, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }
  # dbw1 (was db-witness until 2026-10-20): third voter (etcd only) so the database pair can fail over automatically without split brain.
  dbw1: { role: witness, member: dbw1, ip: 10.0.1.120, flavor: m1.tiny, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }  # default SG only
  # dbw2, dbw3: two more witnesses were added on 2026-10-20 (5 etcd voters) and REMOVED on 2026-10-22 to save memory on c3 (3 voters again).
  # They left etcd first (scripts/db-ha-etcd-shrink.sh); to bring them back uncomment them, run scripts/db-ha-etcd-grow.sh firewall, apply.
  #dbw2: { role: witness, ip: 10.0.1.121, flavor: m1.tiny, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }
  #dbw3: { role: witness, ip: 10.0.1.122, flavor: m1.tiny, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }
  # s3: the RustFS S3 server (docker compose in /opt/rustfs) that holds every Terraform state (docs/s3-state-store.md). The old desktop machine is now `backup`
  # (off-host copies only). role objstore is never stopped by scripts/env-vms.py: Terraform cannot read or write any state while it is off.
  s3: { role: objstore, flavor: m1.small-20g, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }  # default SG only
  # runner has default + k8s SGs, which equal the defaults, so no override needed.
  runner: { role: runner, flavor: m1.medium-20g, domain: rdulinux.com }   # the GitHub Actions runner `finance-runner` (labels qa, finance) and the DB replication monitor; recreated 2026-11-19 with its plain name

  # finance: the DR replica of the finance app (docs/dr-replica.md), moved here from the former environments/dr stack on 2026-11-20 (the dr environment no longer
  # exists). Same VM, port and floating IP (imported, see moved.tf). Default SG only; started with prod by scripts/env-vms.py (role app, last tier).
  finance: { role: app, flavor: m1.small-20g, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"], vars: { prod_host: 13.140.58.46, app_fqdn: finance.rdulinux.com } }   # prod_host = rdu, the source the VM pulls from

  # Kubernetes cluster. VM names are controller1..3 and worker1..3 (no environment suffix in prod); the environment is a tag/metadata.
  controller1: { role: controller_join, flavor: k8s.controller }
  # control-plane nodes 2 and 3 (2026-10-20): join through api.prod.rdulinux.com by themselves and are added to the load balancer prod-api by the reconciler on c3;
  # c3 waits 5 minutes so etcd takes one member at a time. m1.small: the host's RAM allocation limit is the constraint (docs/k8s-ha-control-plane.md).
  controller2: { role: controller_join, flavor: k8s.controller }
  controller3: { role: controller_join, flavor: k8s.controller }
  # workers: flavor k8s.worker = 2 vCPU, 4 GB, 20 GB disk (resized in place from m1.small on 2026-10-22: the CI browser image did not fit in 10 GB)
  worker1: { role: worker, flavor: k8s.worker }   # re-added 2026-10-20 (a fresh VM; the first w1 was retired the same day)
  worker2: { role: worker, flavor: k8s.worker }
  worker3: { role: worker, flavor: k8s.worker }

  # Rancher management server (2026-11-18): single-node K3s + Rancher that manages prod, qa and cka. Role mgmt: stopped first, started last by env-vms.py.
  rancher: { role: mgmt, flavor: m1.medium-20g }

  # c2, w4, w5, w6 were decommissioned by removing them from this file.
