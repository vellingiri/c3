# Source of truth for VMs. Each key is a STABLE name: it is the Terraform
# for_each key, the hostname and the DNS name. Adding/removing/reordering
# entries never touches the other VMs.
#
# defaults:  applied to every node; any node can override a field.
# vars:      free-form values rendered into the cloud-init templates.

environment: prod   # tag/metadata on every resource; never part of a VM name

defaults:
  image: ubuntu2404
  keypair: default-key
  # IDs taken from v1 nodes/compute/compute.tf
  security_group_ids:
    - f00e0d86-c4f7-492d-893d-dab70cf732be  # default
    - 80068ced-6e70-4977-aa86-3ae9b40d3c4e  # k8s
  domain: prod.rdulinux.com     # prod k8s nodes: c1.prod.rdulinux.com ...
  vars:
    dns_server: 192.168.2.2
    nfs_server: repo.rdulinux.com
    k8s_version: v1.30
    calico_version: v3.28.0
    pod_cidr: 192.168.0.0/16
    cluster_name: prod
    join_delay: "0"      # seconds a control-plane join waits (stagger nodes that are created together)
    api_endpoint: ""   # name of the cluster's API load balancer once it is HA (api.prod.rdulinux.com); empty = the first controller's floating IP

nodes:
  # Migrated from v1 (adopted in place with scripts/adopt-node.sh):
  # Shared services stay in the main zone: apps use db.rdulinux.com.
  # db1 was "db". The name db.rdulinux.com is now a service alias for the current primary (see infra/infra.yaml).
  db1: { role: database, ip: 10.0.1.191, flavor: m1.small, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }  # default SG only
  # db1 and db2 run PostgreSQL under Patroni (docs/db-ha-patroni.md); a rebuilt one sets itself up from cloud-init and joins the running pair.
  # `ip` is required for database and witness nodes (the group is built from these addresses; same value the VM already has).
  db2: { role: database, ip: 10.0.1.69, flavor: m1.small, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }
  # dbw1 (was db-witness until 2026-10-20): third voter (etcd only) so the database pair can fail over automatically without split brain.
  dbw1: { role: witness, ip: 10.0.1.120, flavor: m1.tiny, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }  # default SG only
  # dbw2, dbw3: two more witnesses (2026-10-20): 5 etcd voters, so any TWO machines of db1/db2/dbw1/dbw2/dbw3 may be down and the database still fails over by itself.
  dbw2: { role: witness, ip: 10.0.1.121, flavor: m1.tiny, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }
  dbw3: { role: witness, ip: 10.0.1.122, flavor: m1.tiny, domain: rdulinux.com, security_group_ids: ["f00e0d86-c4f7-492d-893d-dab70cf732be"] }
  # runner has default + k8s SGs, which equal the defaults, so no override needed.
  runner: { role: runner, flavor: m1.large, domain: rdulinux.com }

  # Kubernetes cluster. VM names never contain the environment; it is a tag/metadata.
  c1: { role: controller, flavor: m1.medium }
  w1: { role: worker, flavor: m1.small }   # re-added 2026-10-20 (a fresh VM; the first w1 was retired the same day)
  w2: { role: worker, flavor: m1.small }
  w3: { role: worker, flavor: m1.small }

  # c2, w4, w5, w6 were decommissioned by removing them from this file.
