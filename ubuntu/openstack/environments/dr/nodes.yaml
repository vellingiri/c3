# Disaster-recovery replica of PRODUCTION (rdu, 13.140.58.46: docker compose stack in /opt/finance).
# One VM on c3 that runs the same stack, refreshed hourly from rdu (finance-dr-pull.timer). It is a warm
# standby: nothing promotes it automatically. Failover steps: docs/dr-replica.md.
# Name: the VM is `finance` (finance.rdulinux.com; A record and PTR come from the node module). It was called `dr` until 2026-11-20.

environment: dr

defaults:
  image: ubuntu2404
  keypair: default-key
  security_group_ids:
    - f00e0d86-c4f7-492d-893d-dab70cf732be  # default (allows 22/80/443)
  domain: rdulinux.com
  vars:
    dns_server: 192.168.2.2
    prod_host: 13.140.58.46      # rdu, the source the VM pulls from
    app_fqdn: finance.rdulinux.com

nodes:
  finance: { role: app, flavor: m1.small-20g }   # 2 vCPU, 4 GB, 20 GB
