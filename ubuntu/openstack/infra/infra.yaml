# Shared cloud infrastructure for every environment (prod, qa, ...).
# Values copied from the v1 infra modules; change them here, not in the code.

network:
  external:
    name: external_network
    physical_network: physnet1
    cidr: 192.168.2.0/24
    gateway_ip: 192.168.2.1
    pool_start: 192.168.2.51
    pool_end: 192.168.2.150
  private:
    cidr: 10.0.1.0/24
    gateway_ip: 10.0.1.1
    dns_nameservers: [8.8.8.8]

keypair:
  name: default-key
  public_key_path: ~/.ssh/id_ed25519.pub

security_group:
  name: k8s
  description: K8s
  # Cluster ports (API, etcd, kubelet, controller-manager, scheduler) are reachable only from the
  # lab LAN (192.168.2.0/24: floating IPs, your admin machines, the Octavia load balancer) and the private subnet
  # (10.0.1.0/24). Node-to-node traffic is also covered by the `default` group. 443 and ICMP stay open.
  ingress_rules:
    icmp:                  { protocol: icmp }
    tcp-443:               { protocol: tcp, port_min: 443, port_max: 443 }

    tcp-6443-lan:          { protocol: tcp, port_min: 6443,  port_max: 6443,  cidr: 192.168.2.0/24 }
    tcp-6443-private:      { protocol: tcp, port_min: 6443,  port_max: 6443,  cidr: 10.0.1.0/24 }
    tcp-10250-lan:         { protocol: tcp, port_min: 10250, port_max: 10250, cidr: 192.168.2.0/24 }
    tcp-10250-private:     { protocol: tcp, port_min: 10250, port_max: 10250, cidr: 10.0.1.0/24 }
    tcp-10259-lan:         { protocol: tcp, port_min: 10259, port_max: 10259, cidr: 192.168.2.0/24 }
    tcp-10259-private:     { protocol: tcp, port_min: 10259, port_max: 10259, cidr: 10.0.1.0/24 }
    tcp-10257-lan:         { protocol: tcp, port_min: 10257, port_max: 10257, cidr: 192.168.2.0/24 }
    tcp-10257-private:     { protocol: tcp, port_min: 10257, port_max: 10257, cidr: 10.0.1.0/24 }
    tcp-2379-2380-lan:     { protocol: tcp, port_min: 2379,  port_max: 2380,  cidr: 192.168.2.0/24 }
    tcp-2379-2380-private: { protocol: tcp, port_min: 2379,  port_max: 2380,  cidr: 10.0.1.0/24 }

images:
  ubuntu2404: /nfsshare/qcow2/ubuntu2404.qcow2
  debian13: /nfsshare/qcow2/debian13.qcow2

dns:
  zone: rdulinux.com.            # main zone: shared services and static names
  extra_zones:                   # one zone per environment; its VMs register here
    - prod.rdulinux.com.
    - qa.rdulinux.com.
  reverse_zone: 2.168.192.in-addr.arpa.
  email: admin@rdulinux.com
  # key => {ip, ptr?, zone?, name?}. zone defaults to the main zone, name to the key,
  # name "@" is the apex of the record's zone. ptr: true also creates the reverse record.
  # VM records (c1, w1, db, ...) are NOT here: the nodes stacks create those.
  records:
    c3:      { ip: 192.168.2.2, ptr: true }
    repo:    { ip: 192.168.2.3, ptr: true }
    backup:  { ip: 192.168.2.4, ptr: true }
    # db is the service name of the CURRENT primary Postgres (db1 now, db2 after a failover); change ip to fail over.
    db:      { ip: 192.168.2.124, ttl: 60 }
    finance: { ip: 192.168.2.5, ptr: true }   # the finance app, served by finance-lb
    argo:    { ip: 192.168.2.113, ptr: true }   # argo-lb, its own Octavia load balancer (finance-lb keeps 192.168.2.5)
    "@":     { ip: 13.140.58.46 }
    www:     { ip: 13.140.58.46 }
    rdu:     { ip: 13.140.58.46 }
