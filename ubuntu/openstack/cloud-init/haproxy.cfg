global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 120s
    option httplog

# Name-based virtual hosting — one frontend on :80, routed by Host header.
# Add a new vhost by adding an acl + use_backend line below.
frontend web
    bind *:80
    acl host_argo hdr(host),field(1,:) -i argo argo.rdulinux.com
    acl host_qa   hdr(host),field(1,:) -i qa qa.rdulinux.com
    use_backend argocd_nodes if host_argo
    use_backend qa_nodes     if host_qa
    default_backend k8s_nodes

backend k8s_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-Backend-Server %s
    server w1 192.168.2.152:30080 check
    server w2 192.168.2.193:30080 check
    server w3 192.168.2.139:30080 check

# ArgoCD runs in insecure mode (server.insecure: "true" in
# argocd-cmd-params-cm) so it speaks plain HTTP here — no TCP
# passthrough / TLS needed.
backend argocd_nodes
    balance roundrobin
    option httpchk GET /healthz
    server w1 192.168.2.152:30443 check
    server w2 192.168.2.193:30443 check
    server w3 192.168.2.139:30443 check

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s

backend qa_nodes
    balance roundrobin
    server qa-w1 192.168.2.59:30080 check
    server qa-w2 192.168.2.98:30080 check
    server qa-w3 192.168.2.136:30080 check
