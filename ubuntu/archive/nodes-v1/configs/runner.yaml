#cloud-config
package_update: true
package_upgrade: false


ssh_pwauth: true
disable_root: false

runcmd:
  - touch /root/.hushlogin
  - unlink /etc/resolv.conf
  - echo "search rdulinux.com\nnameserver 192.168.2.2" > /etc/resolv.conf
  - apt-get update && apt install curl apt-transport-https ca-certificates lsb-release tzdata perl -y
  - FLOATING_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
